<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Actions CI/CD Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #24292f, #0969da);
      color: #24292f;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
    .meta { font-size: 0.85rem; color: #57606a; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      background: #ddf4ff;
      color: #0969da;
      font-family: monospace;
    }
    .row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input, select, button {
      font-size: 1rem;
      padding: 0.6rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    input { flex: 1; min-width: 0; }
    button {
      width: 100%;
      background: #1f883d;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #1a7f37; }
    #result {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      background: #f6f8fa;
      font-size: 1.2rem;
      text-align: center;
      min-height: 3rem;
    }
    #result.error { background: #ffebe9; color: #cf222e; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CI/CD Demo Calculator</h1>
    <div class="meta">
      Version <span class="badge">{{ version }}</span>
      &middot; Running on <span class="badge">{{ environment }}</span>
    </div>

    <form id="calc-form">
      <div class="row">
        <input id="a" type="number" step="any" placeholder="a" required>
        <select id="operation">
          <option value="add">+</option>
          <option value="subtract">&minus;</option>
          <option value="multiply">&times;</option>
          <option value="divide">&divide;</option>
          <!-- DEMO (missing dependency): uncomment together with the power operation -->
          <option value="power">^</option>
        </select>
        <input id="b" type="number" step="any" placeholder="b" required>
      </div>
      <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>
  </main>

  <script>
    const form = document.getElementById("calc-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const op = document.getElementById("operation").value;
      const params = new URLSearchParams({
        a: document.getElementById("a").value,
        b: document.getElementById("b").value,
      });

      const response = await fetch(`calc/${op}?${params}`);
      const data = await response.json();

      result.className = response.ok ? "" : "error";
      result.textContent = response.ok ? data.result : data.error;
    });
  </script>
</body>
</html>
